name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # host-linux-x64 is temporary (addiscorp/infra#34): [simien] no longer hosts
        # mirab VMs. Back to mirab-linux-x64 (APS 11) once x86 mirab VMs have capacity.
        os: [host-linux-x64, macos-15]
        node: ['18', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - name: Packed CLI runs
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npx --yes --package "$RUNNER_TEMP/anesa-$(node -p 'require("./package.json").version').tgz" anesa --version
